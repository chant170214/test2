name: Build Spatial Radar 3D v2.1

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-spatial-radar-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Restore v2.0 source base
        shell: bash
        run: |
          set -euo pipefail
          for part in part00 part01 part02a part02b part03a part03b; do
            curl --fail --silent --show-error --location \
              "https://raw.githubusercontent.com/chant170214/test2/spatial-radar-v2-build/build_payload/${part}" \
              --output "${part}"
          done
          cat part00 part01 part02a part02b part03a part03b | tr -d '\r\n\t ' > source-v20.b64
          test "$(wc -c < source-v20.b64)" -eq 39380
          base64 --decode source-v20.b64 > source-v20.zip
          unzip -t source-v20.zip
          unzip -q source-v20.zip
          test -f SpatialRadar-v2-src/settings.gradle

      - name: Apply v2.1 reconstruction patches
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/chant170214/test2/spatial-radar-v2-build/build_payload/v21'
          JAVA_DIR='SpatialRadar-v2-src/app/src/main/java/jp/rento/spatialradar3d'
          for file in VoxelMap.java MeshRenderer.java MainActivity.java; do
            curl --fail --silent --show-error --location "$BASE/${file}.gz.b64" --output "${file}.gz.b64"
            base64 --decode "${file}.gz.b64" | gzip -dc > "$JAVA_DIR/$file"
          done
          curl --fail --silent --show-error --location "$BASE/build.gradle.gz.b64" --output build.gradle.gz.b64
          base64 --decode build.gradle.gz.b64 | gzip -dc > SpatialRadar-v2-src/app/build.gradle
          grep -q "versionName '2.1.0'" SpatialRadar-v2-src/app/build.gradle
          grep -q 'carveRay' "$JAVA_DIR/VoxelMap.java"
          grep -q 'setDevicePose' "$JAVA_DIR/MeshRenderer.java"
          grep -q 'ライブ3Dマップ' "$JAVA_DIR/MainActivity.java"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: SpatialRadar-v2-src
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK='SpatialRadar-v2-src/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee badging.txt
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          grep -q "package: name='jp.rento.spatialradar3d'" badging.txt
          grep -q "versionName='2.1.0'" badging.txt
          ! grep -q 'android.permission.INTERNET' permissions.txt
          ! grep -q 'android.permission.ACCESS_NETWORK_STATE' permissions.txt
          cp "$APK" SpatialRadar-3D-LiveMap-Pixel7a-v2.1.0.apk
          sha256sum SpatialRadar-3D-LiveMap-Pixel7a-v2.1.0.apk > SpatialRadar-3D-LiveMap-Pixel7a-v2.1.0.sha256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpatialRadar-3D-LiveMap-Pixel7a-v2.1.0
          path: |
            SpatialRadar-3D-LiveMap-Pixel7a-v2.1.0.apk
            SpatialRadar-3D-LiveMap-Pixel7a-v2.1.0.sha256.txt
            permissions.txt
            badging.txt
          if-no-files-found: error
          retention-days: 14
